openapi: 3.0.3
info:
  title: CRM Connect API
  version: 2.0.0
  description: API CRM với JWT session rotation, RBAC và resource-level authorization.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Profile
  - name: Customers
  - name: Tasks
  - name: Notes
  - name: Administration
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe including database
      responses:
        '200': { description: Service is ready }
        '503': { description: Database is unavailable }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register an employee account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Employee account created; login is still required }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login and create a refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token and issue a new access token
      requestBody: { $ref: '#/components/requestBodies/RefreshToken' }
      responses:
        '200': { description: Tokens rotated, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the supplied refresh session
      requestBody: { $ref: '#/components/requestBodies/RefreshToken' }
      responses:
        '200': { description: Session revoked }
  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset OTP
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } }
      responses:
        '200': { description: Request accepted }
        '429': { description: Rate limit exceeded }
  /api/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with OTP and revoke existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/ValidationError' }
  /api/auth/sessions:
    get:
      tags: [Authentication]
      summary: List current user's active sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session list, content: { application/json: { schema: { type: object, required: [sessions], properties: { sessions: { type: array, items: { $ref: '#/components/schemas/Session' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Authentication]
      summary: Revoke all current user's sessions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: All sessions revoked }
  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Revoke one owned session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/profile:
    get:
      tags: [Profile]
      summary: Get authenticated profile and permissions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    put:
      tags: [Profile]
      summary: Update own profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { full_name: { type: string }, avatar: { type: string, nullable: true } } } } }
      responses:
        '200': { description: Updated profile }
  /api/profile/change-password:
    put:
      tags: [Profile]
      summary: Change password and revoke existing sessions
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
  /api/profile/push-token:
    put:
      tags: [Profile]
      summary: Store Expo push token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        '200': { description: Token stored }
  /api/customers:
    get:
      tags: [Customers]
      summary: List visible customers according to RBAC scope
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } }
    post:
      tags: [Customers]
      summary: Create a customer owned by the actor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '201': { description: Customer created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
  /api/customers/{id}:
    get:
      tags: [Customers]
      summary: Get a customer if resource policy allows it
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Customers]
      summary: Update a customer according to owner/any scope
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } }
      responses:
        '200': { description: Customer updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Customers]
      summary: Delete a customer according to owner/any scope
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: Customer deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks visible to actor
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Task list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Task' } } } } }
    post:
      tags: [Tasks]
      summary: Create a task; only privileged roles can assign others
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } }
      responses:
        '201': { description: Task created }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/tasks/{id}:
    patch:
      tags: [Tasks]
      summary: Update a task according to creator/any scope
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskInput' } } }
      responses:
        '200': { description: Task updated }
    delete:
      tags: [Tasks]
      summary: Delete a task according to creator/any scope
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: Task deleted }
  /api/tasks/{id}/status:
    patch:
      tags: [Tasks]
      summary: Update status according to assignee/any scope
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/TaskStatus' } } } } }
      responses:
        '200': { description: Status updated }
  /api/notes:
    post:
      tags: [Notes]
      summary: Add note according to customer scope
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, content]
              properties:
                customer_id: { type: string, format: uuid }
                content: { type: string }
      responses:
        '201': { description: Note created }
  /api/users:
    get:
      tags: [Administration]
      summary: List users; Manager and Admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/UserRole' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200': { description: Paginated user list, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/users/{id}/role:
    patch:
      tags: [Administration]
      summary: Change role and revoke target sessions; Admin only
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [role], properties: { role: { $ref: '#/components/schemas/UserRole' } } } } }
      responses:
        '200': { description: Role changed }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/{id}/status:
    patch:
      tags: [Administration]
      summary: Change status and revoke target sessions; Admin only
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/UserStatus' } } } } }
      responses:
        '200': { description: Status changed }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/security-events:
    get:
      tags: [Administration]
      summary: List audited security events; Admin only
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SecurityEventType' } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Paginated security event list, content: { application/json: { schema: { $ref: '#/components/schemas/SecurityEventPage' } } } }
  /api/admin/overview:
    get:
      tags: [Administration]
      summary: Get Admin Lite operational and security dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Admin overview, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  requestBodies:
    RefreshToken:
      required: true
      content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
  responses:
    Unauthorized: { description: Missing, expired or revoked authentication, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Authenticated but permission or resource policy denied, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Invalid request data, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found or not visible, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Business rule conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        details: { nullable: true }
        requestId: { type: string }
    UserRole: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE] }
    UserStatus: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
    CustomerStatus: { type: string, enum: [NEW, CONTACTED, QUALIFIED, PROPOSAL, NEGOTIATION, WON, LOST] }
    TaskStatus: { type: string, enum: [PENDING, IN_PROGRESS, COMPLETED, CANCELLED] }
    SecurityEventType: { type: string, enum: [LOGIN_SUCCESS, LOGIN_FAILURE, TOKEN_ROTATED, REFRESH_REUSE_DETECTED, LOGOUT, SESSION_REVOKED, PASSWORD_RESET, ACCESS_DENIED, ROLE_CHANGED, ACCOUNT_STATUS_CHANGED] }
    User:
      type: object
      required: [id, full_name, email, role, status]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/UserRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        permissions: { type: array, items: { type: string }, example: [customer:read:any] }
    RegisterRequest:
      type: object
      required: [full_name, email, password]
      properties:
        full_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
    TokenPair:
      type: object
      required: [token, refreshToken]
      properties:
        token: { type: string, description: Short-lived access token }
        refreshToken: { type: string }
    AuthResponse:
      allOf:
        - { $ref: '#/components/schemas/TokenPair' }
        - type: object
          required: [user]
          properties: { user: { $ref: '#/components/schemas/User' } }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        company: { type: string, nullable: true }
        address: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/CustomerStatus' }
    Customer:
      allOf:
        - { $ref: '#/components/schemas/CustomerInput' }
        - type: object
          required: [id, ownerId, capabilities]
          properties:
            id: { type: string, format: uuid }
            ownerId: { type: string, format: uuid }
            capabilities: { $ref: '#/components/schemas/Capabilities' }
    TaskInput:
      type: object
      required: [title, customer_id]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
        customer_id: { type: string, format: uuid }
        assigneeId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TaskStatus' }
    Task:
      allOf:
        - { $ref: '#/components/schemas/TaskInput' }
        - type: object
          required: [id, createdById, assigneeId, capabilities]
          properties:
            id: { type: string, format: uuid }
            createdById: { type: string, format: uuid }
            capabilities: { $ref: '#/components/schemas/Capabilities' }
    Capabilities:
      type: object
      additionalProperties: { type: boolean }
      example: { canUpdate: true, canDelete: false, canUpdateStatus: true }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    UserPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    SecurityEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid, nullable: true }
        type: { $ref: '#/components/schemas/SecurityEventType' }
        ipAddress: { type: string, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        user:
          nullable: true
          allOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                full_name: { type: string }
                email: { type: string, format: email }
    SecurityEventPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    AdminOverview:
      type: object
      required: [generatedAt, users, customers, tasks, sessions, security]
      properties:
        generatedAt: { type: string, format: date-time }
        users: { type: object, properties: { total: { type: integer }, byRole: { type: object, additionalProperties: { type: integer } }, byStatus: { type: object, additionalProperties: { type: integer } } } }
        customers: { type: object, properties: { total: { type: integer } } }
        tasks: { type: object, properties: { total: { type: integer }, byStatus: { type: object, additionalProperties: { type: integer } } } }
        sessions: { type: object, properties: { active: { type: integer } } }
        security: { type: object, properties: { alerts24h: { type: integer }, recentEvents: { type: array, items: { $ref: '#/components/schemas/SecurityEvent' } } } }
