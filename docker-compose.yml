services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: crm_connect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d crm_connect"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000

      DATABASE_URL: postgresql://postgres:123456@postgres:5432/crm_connect?schema=public

      JWT_ACCESS_SECRET: crm-secret-key-render-deployment
      JWT_REFRESH_SECRET: crm-refresh-secret-key-render-deployment

      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      TRUST_PROXY: "0"
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:3000/health/ready"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: